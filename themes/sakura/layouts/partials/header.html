<header class="mx-topbar">
  <div class="mx-topbar-inner">
    <a class="mx-logo" href="{{ "" | relLangURL }}">
      <span class="mx-logo-icon">{{ .Site.Title | truncate 1 "" }}</span>
      <span>{{ .Site.Title }}</span>
    </a>
    <nav class="mx-nav">
      {{ $current := .RelPermalink }}
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="{{ if or ($.IsMenuCurrent "main" .) (eq $current .URL) }}active{{ end }}">{{ .Name }}</a>
      {{ end }}
      <button class="mx-theme-toggle" id="theme-toggle" aria-label="切换主题">🌙</button>
    </nav>
  </div>
</header>
